<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Workboard V10.3</title>
  <link rel="stylesheet" href="style.css?v=10.3.0" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">W</div>
        <div><div class="brand-title">My Workboard</div><div class="brand-sub">Personal Work OS · V10.3</div></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-page="today">🏠 Today</button>
        <button class="nav-item" data-page="routine">🔁 Routine</button>
        <button class="nav-item" data-page="projects">🗂 Projects</button>
        <button class="nav-item" data-page="sop">📚 SOP</button>
        <button class="nav-item" data-page="history">📜 Execution History</button>
        <button class="nav-item" data-page="kanban">📊 Kanban</button>
        <button class="nav-item" data-page="memo">📝 Memo</button>
        <button class="nav-item" data-page="templates">🧩 Templates</button>
        <button class="nav-item" data-page="settings">⚙ Settings</button>
      </nav>
      <div class="sidebar-note">数据保存在当前浏览器 IndexedDB。<br/>建议定期导出备份。</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><h1 id="pageTitle">Today</h1><div id="todayText" class="muted"></div></div>
        <button class="ghost-btn" id="quickBackupBtn">💾 导出备份</button>
      </header>
      <section id="page-today" class="page active"></section>
      <section id="page-routine" class="page"></section>
      <section id="page-projects" class="page"></section>
      <section id="page-sop" class="page"></section>
      <section id="page-history" class="page"></section>
      <section id="page-kanban" class="page"></section>
      <section id="page-memo" class="page"></section>
      <section id="page-templates" class="page"></section>
      <section id="page-settings" class="page"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="drawerRoot"></div>
  <div id="toastRoot"></div>

  <script src="db.js?v=10.3.0"></script>
  <script src="app.js?v=10.3.0"></script>
</body>
</html>
